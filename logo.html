<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ハナサク ロゴ</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f0f0f0; }

        .logo-wrap {
            width: 640px;
            height: 640px;
            background: linear-gradient(135deg, #fdf8f6 0%, #f5e6ea 100%);
            border-radius: 128px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* 花びら */
        .flower {
            position: relative;
            width: 160px;
            height: 160px;
            margin-bottom: 20px;
        }

        .petal {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50% 50% 50% 0;
            opacity: .85;
        }

        .p1 { background: #c06070; top: 0; left: 50px; transform: rotate(0deg); }
        .p2 { background: #e8a0a8; top: 20px; left: 95px; transform: rotate(72deg); }
        .p3 { background: #d4808e; top: 70px; left: 85px; transform: rotate(144deg); }
        .p4 { background: #e8a0a8; top: 70px; left: 15px; transform: rotate(216deg); }
        .p5 { background: #d4808e; top: 20px; left: 5px; transform: rotate(288deg); }

        .center-dot {
            position: absolute;
            width: 30px;
            height: 30px;
            background: #fff;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 2px 8px rgba(192,96,112,.3);
        }

        .logo-text {
            font-family: 'Zen Maru Gothic', sans-serif;
            font-size: 96px;
            font-weight: 700;
            color: #c06070;
            letter-spacing: .05em;
        }

        .logo-sub {
            font-family: 'Zen Maru Gothic', sans-serif;
            font-size: 28px;
            color: #d4808e;
            margin-top: 4px;
            letter-spacing: .15em;
        }

        /* 背景の装飾 */
        .bg-circle1 {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: rgba(232,160,168,.1);
            top: -40px;
            right: -40px;
        }
        .bg-circle2 {
            position: absolute;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: rgba(192,96,112,.08);
            bottom: -30px;
            left: -30px;
        }

        .instructions {
            margin-top: 40px;
            font-family: sans-serif;
            font-size: 14px;
            color: #999;
            text-align: center;
        }
    </style>
</head>
<body>
    <div>
        <div class="logo-wrap">
            <div class="bg-circle1"></div>
            <div class="bg-circle2"></div>
            <div class="flower">
                <div class="petal p1"></div>
                <div class="petal p2"></div>
                <div class="petal p3"></div>
                <div class="petal p4"></div>
                <div class="petal p5"></div>
                <div class="center-dot"></div>
            </div>
            <div class="logo-text">ハナサク</div>
            <div class="logo-sub">就活伴走コーチング</div>
        </div>
        <div class="instructions">
            ↑ この画像を右クリック → スクリーンショットで保存<br>
            または Windowsキー + Shift + S で範囲選択して保存
        </div>
    </div>
</body>
</html>
